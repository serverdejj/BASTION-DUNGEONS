name: Build BASTION DUNGEONS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build plugin
        run: gradle build

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: BASTION-DUNGEONS
          path: build/libs/*.jar
